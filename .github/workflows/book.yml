name: Compile book and upload PDF

on:
  pull_request:
    branches:
    - main
  push:
    branches:
    - main
    tags:
    - '*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-main-tex:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Prepare main.tex
      run: |
        # Remove draft options and disable TikZ externalization for CI builds
        sed -i 's/draftbib,/%draftbib,/g' main.tex
        sed -i 's/draftfigures,/%draftfigures,/g' main.tex
        sed -i 's/draftglossaries,/%draftglossaries,/g' main.tex
        sed -i 's/^\\tikzexternalize/%\\tikzexternalize/g' main.tex

    - name: Print main.tex
      run: cat main.tex

    - name: Upload main.tex for next job
      uses: actions/upload-artifact@v7
      with:
        name: main-tex
        path: main.tex
  render-book:
    runs-on: ubuntu-latest
    needs: [prepare-main-tex]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Download main.tex from previous job
      uses: actions/download-artifact@v8
      with:
        name: main-tex
        path: .

    - name: Disable printing setup
      run: |
        sed -i 's/twoside=true/twoside=false/g' main.tex
        sed -i 's/\\printedversiontrue/\\printedversionfalse/g' main.tex

    - name: Compile LaTeX document
      uses: xu-cheng/latex-action@v4
      with:
        root_file: main.tex
        latexmk_shell_escape: true
        texlive_version: 2023
        extra_system_packages: font-liberation

    - name: Rename PDF
      run: mv main.pdf jerome-eertmans-phd-thesis.pdf

    - name: Upload PDF
      uses: actions/upload-artifact@v7
      with:
        path: jerome-eertmans-phd-thesis.pdf
        archive: false

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-logs
        path: '**/*.log'

  render-book-for-printing:
    runs-on: ubuntu-latest
    needs: [prepare-main-tex]
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Download main.tex from previous job
      uses: actions/download-artifact@v8
      with:
        name: main-tex
        path: .

    - name: Prepare main.tex for printing
      run: |
        sed -i 's/twoside=false/twoside=true/g' main.tex
        sed -i 's/\\printedversionfalse/\\printedversiontrue/g' main.tex

    - name: Compile LaTeX document
      uses: xu-cheng/latex-action@v4
      with:
        root_file: main.tex
        latexmk_shell_escape: true
        texlive_version: 2023
        extra_system_packages: font-liberation

    - name: Rename PDF
      run: mv main.pdf jerome-eertmans-phd-thesis-for-printing.pdf

    - name: Upload PDF
      uses: actions/upload-artifact@v7
      with:
        path: jerome-eertmans-phd-thesis-for-printing.pdf
        archive: false

    - name: Upload logs on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: build-logs
        path: '**/*.log'

  push-to-build-branch:
    runs-on: ubuntu-latest
    needs: [render-book]
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Download PDF from previous job
      uses: actions/download-artifact@v8
      with:
        name: jerome-eertmans-phd-thesis.pdf
        path: .

    - name: Push PDF to orphan build branch
      run: |
        # 1. Create a temporary folder and copy the PDF there
        mkdir _deploy
        cp jerome-eertmans-phd-thesis.pdf _deploy/
        cd _deploy

        # 2. Initialize a fresh git repository and create the orphan branch
        git init
        git checkout --orphan build

        # 3. Configure git identity (required for Actions)
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

        # 4. Add the PDF and create the single commit
        git add jerome-eertmans-phd-thesis.pdf
        git commit -m "Push latest PDF build"

        # 5. Force push to the remote repository
        git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
        git push --force origin build
